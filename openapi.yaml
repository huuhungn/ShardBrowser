openapi: 3.0.3

info:
  title: ShardX Launcher — Automation API
  version: "0.1.29"
  description: |
    Local HTTP API for automating the ShardX anti-detect browser launcher:
    generate fingerprints, create/launch/close profiles, and obtain a Chrome
    DevTools Protocol (CDP) WebSocket endpoint to drive a launched profile
    with Puppeteer / Playwright.

    ## Binding & lifecycle
    The server runs inside the launcher app, bound to **127.0.0.1** only,
    on the port configured in *Settings → Automation API* (default **40325**).
    It is **not** reachable from other hosts. Enable *Settings → Startup &
    background services* to launch ShardX at desktop sign-in and make the API
    available automatically. API enable/port changes take effect after the app
    restarts.

    ## Authentication
    Every endpoint except `GET /health` requires a **Bearer JWT** (HS256,
    signed with the launcher's stored secret):

        Authorization: Bearer <token>

    The permanent token is shown in *Settings → Automation API* (copy it
    from there). Pressing **Regenerate token** rotates the signing secret
    live — the new token works immediately and every previously issued
    token is invalidated at once. There is no separate API key and no
    token-minting endpoint: the token itself is the credential.

    Missing/invalid token → `401` with an empty body.

    ## Typical flow
    1. `GET /fingerprint/new/{platform}` → a fully uniquified fingerprint
       (random platform_version, host-aware CPU/RAM, clamped screen,
       library noise prefs), **not** persisted.
    2. Optionally edit the returned `fingerprint` object (e.g. flip
       `noise.fonts.enabled`, set `webrtc`, tweak `navigator`).
    3. `POST /profiles` (or `POST /folders/{folder}/profiles`) with that
       object as `fingerprint` → the launcher stores it **verbatim**
       (create never re-randomizes).
    4. `POST /profiles/{id}/start` → returns the CDP endpoint; connect with
       `browserWSEndpoint = cdp.web_socket_debugger_url`.
    5. `POST /profiles/{id}/stop` when done.

    ## Proxies & QUIC/WebRTC
    On **every** launch (UI or API), before the browser starts, the bound
    proxy is probed live for UDP-relay (SOCKS5 UDP_ASSOCIATE). If UDP works,
    QUIC is enabled and WebRTC may use the proxied UDP relay; otherwise QUIC
    is disabled and WebRTC collapses to TCP-only so the real IP can't leak.
    Timezone/locale/geo `auto` fields are resolved live through the proxy at
    launch too. Passing `proxy` (string) on a persistent create adds it to
    the store and full-tests it up front; a temporary profile keeps it inline.

    ## Temporary profiles
    `POST /profiles/temporary` creates a profile flagged `temporary`: it is
    hidden from `GET /profiles` and from the launcher UI, and is deleted
    (config + user-data-dir) automatically when its browser closes. If the
    app crashes while one is open, it is purged on the next app start.

    ## Fingerprint object
    The `fingerprint` returned by `GET /fingerprint/new*` and accepted by
    the create endpoints is the launcher's native FingerprintConfig. It is
    round-tripped verbatim, so the schema below documents the common
    sub-objects but is intentionally open (`additionalProperties: true`).

    ## MCP server
    A companion **MCP** (Model Context Protocol) server lets an AI client
    drive the launcher through *this* API plus a profile's browser over
    CDP. It is a separate Node process — **not** part of this HTTP API and
    not hosted by it. Get it from the launcher (**Settings → MCP server →
    Download MCP server**, or the sidebar "Download MCP" button), which
    saves the source to a folder you choose; or from the repo at
    `rust/shardx-launcher/mcp/`.

    Under the hood it just calls this API: configure it with
    `SHARDX_API` (this base URL) and `SHARDX_TOKEN` (the Bearer token from
    *Settings → Automation API*). It exposes:
    - **API tools** — thin wrappers over the endpoints below
      (profiles, fingerprints, proxies, folders, cookies, start/stop).
    - **Browser tools** (patchright over CDP) — `browser_navigate`,
      `browser_evaluate`, `browser_screenshot`, `browser_click`,
      `browser_fill`, tabs, waits, etc., targeting a profile started via
      `POST /profiles/{id}/start` (which returns the CDP endpoint).

    Run it standalone over **stdio** (the client spawns it) or, with
    `MCP_HTTP_PORT` set, over HTTP at `127.0.0.1:<port>/mcp`. See the MCP
    server's README for setup. The launch-at-login entry starts the Launcher
    and embedded API; MCP remains client-spawned rather than an always-on
    daemon.

servers:
  - url: http://127.0.0.1:40325
    description: Local launcher (default port; change in Settings)

security:
  - bearerAuth: []

tags:
  - name: System
  - name: Fingerprints
  - name: Profiles
  - name: Folders
  - name: Tags
  - name: Proxies
  - name: Extensions
  - name: Bookmarks
  - name: Trash

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      description: Returns basic server info. The only endpoint that does **not** require auth.
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  name: { type: string, example: shardx-launcher }
                  version: { type: string, example: "0.1.29" }
                  capabilities:
                    type: array
                    items: { type: string }
                    example: [launch-instance-ownership-v1]

  /startup:
    get:
      tags: [System]
      summary: Inspect desktop sign-in startup
      description: |
        Reports both the saved launch-at-login preference and the operating
        system's observed registration state. No executable path is returned.
        The Automation API is embedded in the Launcher; MCP is spawned on
        demand by its client.
      responses:
        "200":
          description: Current startup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [System]
      summary: Configure desktop sign-in startup
      description: |
        Enables or disables the current user's ShardX Launcher startup entry
        and persists the matching preference. This does not create a separate
        API or MCP daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartupConfigRequest" }
      responses:
        "200":
          description: Updated and verified startup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: The operating-system registration or settings write failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprint/new:
    get:
      tags: [Fingerprints]
      summary: Generate a new fingerprint (host OS)
      description: |
        Returns a fully uniquified fingerprint for the **host** operating
        system, without persisting it. Equivalent to
        `/fingerprint/new/{platform}` with the launcher host's platform.
      responses:
        "200":
          description: A uniquified, unsaved fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The fingerprint library is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprint/new/{platform}:
    get:
      tags: [Fingerprints]
      summary: Generate a new fingerprint for a platform
      description: |
        Picks a random library fingerprint matching `platform`, then
        uniquifies it: a fresh Sec-CH-UA `platform_version`, host-aware
        `hardware_concurrency`/`device_memory` (never claims more than the
        real machine), and a screen clamped to the real display. Returned
        unsaved — feed it to a create endpoint as `fingerprint`.
      parameters:
        - name: platform
          in: path
          required: true
          description: Case-insensitive; `win`/`osx`/`darwin` aliases accepted.
          schema:
            type: string
            enum: [Windows, macOS, Linux]
      responses:
        "200":
          description: A uniquified, unsaved fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FingerprintEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No matching fingerprint and the library is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles:
    get:
      tags: [Profiles]
      summary: List profiles
      description: |
        Lists persistent profiles (temporary profiles are hidden), newest
        first, pinned on top. Each entry is enriched with live run state.
      responses:
        "200":
          description: Profile list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Profiles]
      summary: Create a profile
      description: |
        Persists a profile from a client-supplied `fingerprint` **exactly as
        given** (no re-randomization — uniquification already happened in
        `/fingerprint/new`). Use `folder` to file it; bind a proxy by stored
        `proxy_id` or attach one inline via `proxy` (a string that is NOT
        saved to the proxy store).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Created profile metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Missing/!object `fingerprint`, invalid/reserved/duplicate profile name, or an unparseable proxy string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Another profile create/edit/import operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/temporary:
    post:
      tags: [Profiles]
      summary: Create a temporary profile
      description: |
        Creates a profile from a random (or specified) library fingerprint,
        uniquified like `/fingerprint/new` and stored verbatim, flagged
        `temporary`: hidden from listings and **auto-deleted when its
        browser closes** (or purged on next app start after a crash). Pair
        with `POST /profiles/{id}/start`.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TempProfileRequest" }
      responses:
        "200":
          description: Created temporary profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  fingerprint_id:
                    type: string
                    description: The library entry the profile was generated from.
                  temporary: { type: boolean, example: true }
                  proxy_inline:
                    type: boolean
                    description: Whether an inline proxy string was attached.
        "400":
          description: Unparseable proxy string, or an unknown noise vector.
          description: Invalid/reserved/duplicate profile name or unparseable proxy string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Another profile create/edit/import operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No matching fingerprint / empty library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}:
    get:
      tags: [Profiles]
      summary: Get a profile
      description: |
        Returns the full stored profile: the `_meta` envelope plus the
        flattened FingerprintConfig. If the profile is running, `running`
        and `cdp` are added.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Profiles]
      summary: Delete a profile
      description: |
        Moves the profile to the trash, where it stays restorable for 7 days
        before it is swept. What is archived is the account — cookies, logins,
        web data, preferences, Local Storage, IndexedDB — not the caches, so
        the archive is a fraction of the user-data dir. The original config and
        user-data dir are removed once the archive is written.

        Temporary profiles are torn down by the process tracker when their
        browser closes and never reach the trash.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Moved to the trash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string, format: uuid }
                  trashed:
                    type: boolean
                    example: true
                    description: Restorable from the launcher's Trash for 7 days.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The browser is running or another profile lifecycle operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Deletion failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [Profiles]
      summary: Edit a profile
      description: |
        Updates only the provided fields. When `fingerprint` is given it
        REPLACES the stored fingerprint verbatim (no re-randomization).
        `folder: ""` unfiles the profile; `proxy_id: ""` unbinds the proxy;
        a `proxy` string is stored (deduped) + full-tested, then bound.
        Returns the updated stored profile.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditProfileRequest" }
      responses:
        "200":
          description: Updated stored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoredProfile" }
        "400":
          description: Bad fingerprint, invalid/reserved/duplicate profile name, or unparseable proxy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The browser is running or another profile lifecycle operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/start:
    post:
      tags: [Profiles]
      summary: Launch a profile (with CDP)
      description: |
        Spawns the ShardX browser for the profile with remote-debugging
        enabled, resolves any `auto` timezone/locale/geo from the bound
        proxy, and returns the CDP endpoint once Chrome has written its
        DevToolsActivePort. CDP is enabled **only** on API launches (UI
        launches stay debugging-free for anti-detect). `cdp` is `null` if
        the endpoint couldn't be read within the timeout. Works for both
        regular and temporary profiles.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: false
        description: Optional. Empty body launches headed.
        content:
          application/json:
            schema:
              type: object
              properties:
                headless:
                  type: boolean
                  default: false
                  description: Launch headless (--headless=new).
      responses:
        "200":
          description: Launched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  pid: { type: integer, format: int64, description: OS process id. }
                  launch_instance_token:
                    type: string
                    format: uuid
                    description: Opaque in-memory identity for this exact launch; use only with the conditional launch-instance stop endpoint.
                  headless: { type: boolean }
                  cdp:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/CdpInfo" }]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The browser is already running or the profile is being modified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Binary not configured / spawn failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/stop:
    post:
      tags: [Profiles]
      summary: Stop a profile
      description: |
        Sends the browser a graceful shutdown (SIGTERM on Unix; 5s grace
        then SIGKILL). Temporary profiles are deleted as part of close.
        `stopped` is `false` if the profile wasn't running.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Stop requested.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  stopped: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{id}/stop-if-pid/{expected_pid}:
    post:
      tags: [Profiles]
      summary: Disabled legacy PID guard
      deprecated: true
      description: |
        Retained only so older clients fail closed with 410. PID alone cannot distinguish a
        recycled numeric PID, so this endpoint never stops a process. Use
        `stop-if-launch-instance`.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: expected_pid
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410":
          description: PID-only conditional stopping is permanently disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/stop-if-launch-instance:
    post:
      tags: [Profiles]
      summary: Stop one exact profile launch instance
      description: |
        Stops only the in-memory launch instance identified by both its PID and
        opaque launch-instance token. The token is returned by the matching
        authenticated start call, is never persisted, and must be sent in the
        JSON body rather than a URL.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_pid, launch_instance_token]
              properties:
                expected_pid:
                  type: integer
                  format: int64
                  minimum: 1
                launch_instance_token:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Conditional stop result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_id: { type: string }
                  stopped: { type: boolean }
                  pid: { type: integer, format: int64 }
        "400":
          description: PID or launch-instance token is malformed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The tracked PID or launch-instance token no longer matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /profiles/{id}/cookies:
    get:
      tags: [Profiles]
      summary: Export cookies
      description: |
        Reads the profile's Chromium cookie store and returns all cookies
        **decrypted**. Works whether the profile is running or stopped.
        Empty array if the profile has never launched.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Cookies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cookies:
                    type: array
                    items: { $ref: "#/components/schemas/Cookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Cookie DB read/decrypt failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Profiles]
      summary: Import cookies
      description: |
        Writes cookies into the profile's cookie store (re-encrypting to
        Chromium's v10 scheme). The profile **must be stopped** — a running
        browser rewrites the store on exit and would clobber the import.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cookies]
              properties:
                cookies:
                  type: array
                  items: { $ref: "#/components/schemas/Cookie" }
      responses:
        "200":
          description: Imported.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer, description: Number of cookies written. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Profile is running — stop it first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Cookie DB write failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /folders:
    get:
      tags: [Folders]
      summary: List folders
      description: Distinct, non-empty folder tags across persistent profiles.
      responses:
        "200":
          description: Folder names.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: ["work", "scrapers"]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /tags:
    get:
      tags: [Tags]
      summary: List tags
      description: |
        Every tag on a persistent profile or with a stored color, sorted by
        name, with how many profiles carry it. Tag names match
        case-insensitively; rename, recolor and delete are in the launcher.
      responses:
        "200":
          description: Tags.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /folders/{folder}:
    patch:
      tags: [Folders]
      summary: Rename a folder
      description: Retags every profile in the folder. Returns the count.
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: New folder name. }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  renamed_to: { type: string }
                  profiles: { type: integer, description: Profiles retagged. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A target browser is running or another profile lifecycle operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Profile inventory or atomic write failed; the error reports any partial progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Folders]
      summary: Delete a folder
      description: |
        Deletes the folder tag. With `delete_profiles=true` the profiles in
        it are deleted too; otherwise they're unfiled (moved to "All").
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
        - name: delete_profiles
          in: query
          required: false
          description: Delete the profiles in the folder (default false = unfile).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_folder: { type: string }
                  delete_profiles: { type: boolean }
                  profiles: { type: integer, description: Profiles affected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: A target browser is running or another profile lifecycle operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Profile inventory, delete, or atomic write failed; the error reports any partial progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /folders/{folder}/profiles:
    post:
      tags: [Folders]
      summary: Create a profile in a folder
      description: |
        Same as `POST /profiles`, but the folder comes from the path
        (overriding any `folder` in the body).
      parameters:
        - name: folder
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "200":
          description: Created profile metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "400":
          description: Missing/!object `fingerprint`, invalid/reserved/duplicate profile name, or an unparseable proxy string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Another profile create/edit/import operation is in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /fingerprints:
    get:
      tags: [Fingerprints]
      summary: List library fingerprints
      description: The on-disk fingerprint library (GPU presets) the launcher ships/imports.
      responses:
        "200":
          description: Library entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /running:
    get:
      tags: [Profiles]
      summary: List running profiles
      description: Profiles with a live browser process, including the CDP endpoint when launched via the API.
      responses:
        "200":
          description: Running profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RunningProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies:
    get:
      tags: [Proxies]
      summary: List stored proxies
      description: Proxies saved in the launcher store. **Credentials (username/password) are never returned.**
      responses:
        "200":
          description: Proxy summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProxySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Proxies]
      summary: Add a proxy
      description: |
        Adds a proxy to the store (deduped by endpoint). Pass `proxy` as a
        string, or explicit `host`/`port` (+ `kind`/`username`/`password`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddProxyRequest" }
      responses:
        "200":
          description: Stored proxy summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxySummary" }
        "400":
          description: Unparseable proxy / missing host+port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /proxies/{id}:
    delete:
      tags: [Proxies]
      summary: Delete a proxy
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions:
    get:
      tags: [Extensions]
      summary: List the extension library
      description: |
        Extensions available to profiles. The `id` of each is what
        `POST /profiles` and `PATCH /profiles/{id}` take in `extensions`.

        Icons are omitted here: a data URL runs to hundreds of kilobytes and a
        listing of thirty would be mostly base64. `POST /extensions` returns
        the icon for the one it just added.
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extension" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Extensions]
      summary: Add an extension
      description: |
        Give either `url` or `path`.

        `url` takes a Chrome Web Store page, a bare 32-character extension id,
        or a direct link to a `.crx` / `.zip`; the launcher resolves the store
        page to the download itself. `path` takes a local `.crx`, `.zip`, or an
        unpacked folder on the machine running the launcher.

        Name, version, description and icon come out of the extension's own
        `manifest.json` — including `__MSG_*__` placeholders, resolved against
        its default locale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddExtensionRequest" }
      responses:
        "200":
          description: Added; `icon` is populated on this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extension" }
        "400":
          description: Neither `url` nor `path` given, the link is not an extension, or the store has no such id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /extensions/{id}:
    delete:
      tags: [Extensions]
      summary: Remove an extension
      description: |
        Profiles hold ids, not copies, so any profile naming this extension
        stops loading it from its next launch. Their stored list is left as it
        is — re-adding the extension does not restore the binding.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks:
    get:
      tags: [Bookmarks]
      summary: List folder bookmarks
      responses:
        "200":
          description: Every bookmark, across folders.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Bookmarks]
      summary: Add or update a bookmark
      description: |
        With `id` it updates that bookmark; without, it creates one.

        A bookmark bound to a folder appears in the bookmarks bar of every
        profile in that folder, inside a folder called **ShardX**; `folder: ""`
        means every profile. Only that folder is managed, so bookmarks the
        operator saved inside a profile are untouched.

        Applied when a profile next launches — the file is written just before
        the browser reads it, so a running profile does not see the change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkRequest" }
      responses:
        "200":
          description: The saved bookmark.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400":
          description: No URL given.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /bookmarks/{id}:
    delete:
      tags: [Bookmarks]
      summary: Delete a bookmark
      description: It leaves its profiles on their next launch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, example: true }
                  id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash:
    get:
      tags: [Trash]
      summary: List deleted profiles
      description: |
        Profiles `DELETE /profiles/{id}` archived, newest first, each with the
        instant it stops being restorable. The sweep runs at launcher startup.
      responses:
        "200":
          description: The trash.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrashEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /trash/{id}/restore:
    post:
      tags: [Trash]
      summary: Restore a deleted profile
      description: |
        Puts the profile back under its **own id**, so a script, a bookmark
        folder or a proxy binding that referenced it still points at it. The
        archive is removed once the profile is back.

        What returns is the account — cookies, logins, web data, preferences,
        history, bookmarks, Local Storage, IndexedDB. Caches were never
        archived and are rebuilt on the next launch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The restored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Nothing in the trash under that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trash/{id}:
    delete:
      tags: [Trash]
      summary: Delete a trashed profile for good
      description: Irreversible — the archive is the only remaining copy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  purged: { type: boolean, example: true }
                  id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Permanent JWT from Settings → Automation API.

  parameters:
    ProfileId:
      name: id
      in: path
      required: true
      description: Profile UUID.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token.

  schemas:
    StartupConfigRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Register or remove ShardX Launcher for the current user's desktop sign-in.
        start_minimized:
          type: boolean
          default: true
          description: Keep the main window hidden in the system tray for startup launches.

    StartupStatus:
      type: object
      required:
        - supported
        - configured
        - registered
        - matches_configuration
        - start_minimized
        - launched_for_autostart
        - api_enabled
        - api_mode
        - mcp_mode
      properties:
        supported: { type: boolean, example: true }
        configured: { type: boolean, description: Saved launch-at-login preference. }
        registered: { type: boolean, description: Operating-system observed registration state. }
        matches_configuration: { type: boolean }
        start_minimized: { type: boolean }
        launched_for_autostart: { type: boolean }
        api_enabled: { type: boolean }
        api_mode: { type: string, enum: [launcher_embedded] }
        mcp_mode: { type: string, enum: [client_spawned] }

    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    FingerprintEnvelope:
      type: object
      properties:
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
      required: [fingerprint]

    Fingerprint:
      type: object
      description: |
        Native FingerprintConfig. Documented sub-objects are the common
        ones; the object is open and stored verbatim by the create
        endpoints, except `custom_fonts`, which is rejected until the bundled
        browser engine can prove coherent font rendering and profile isolation.
      additionalProperties: true
      properties:
        name: { type: string }
        notes: { type: string }
        seed:
          type: integer
          description: 0 = overrides-only mode (the common case).
        navigator:
          type: object
          additionalProperties: true
          properties:
            user_agent: { type: string }
            platform: { type: string, example: "Win32" }
            hardware_concurrency: { type: integer, example: 12 }
            device_memory: { type: integer, enum: [8, 16, 32], example: 16 }
            language: { type: string }
            do_not_track: { type: boolean }
        screen:
          type: object
          additionalProperties: true
          properties:
            width: { type: integer }
            height: { type: integer }
            avail_width: { type: integer }
            avail_height: { type: integer }
            color_depth: { type: integer, example: 24 }
            device_pixel_ratio: { type: number, example: 2 }
            color_gamut: { type: string, enum: ["", srgb, p3, rec2020] }
        client_hints:
          type: object
          description: Sec-CH-UA family (browser.vision calls this `hints`).
          additionalProperties: true
          properties:
            platform: { type: string }
            platform_version: { type: string }
            architecture: { type: string, example: "x86" }
            bitness: { type: string, example: "64" }
            mobile: { type: boolean }
        webgl:
          type: object
          additionalProperties: true
          properties:
            unmasked_vendor: { type: string }
            unmasked_renderer: { type: string }
        webgpu:
          type: object
          additionalProperties: true
        webrtc:
          type: string
          description: WebRTC handling mode.
          enum: [auto, tcp_only, block]
        noise:
          $ref: "#/components/schemas/NoisePrefs"
        launch:
          $ref: "#/components/schemas/LaunchOptions"
        network:
          type: object
          properties:
            blocked_ports:
              type: array
              items: { type: integer }
              description: Local-network port-scan defense (ports_protection).
        timezone:
          type: string
          description: IANA name, or "auto" to resolve from the bound proxy at launch.

    NoisePrefs:
      type: object
      description: |
        Per-vector anti-fingerprint noise. Each block is `{enabled, seed}`
        (+ feature-specific knobs). `enabled:false` = pass-through.
      properties:
        canvas: { $ref: "#/components/schemas/NoiseBlock" }
        webgl:
          allOf: [{ $ref: "#/components/schemas/NoiseBlock" }]
          properties:
            intensity: { type: number }
        audio:
          allOf: [{ $ref: "#/components/schemas/NoiseBlock" }]
          properties:
            intensity: { type: number }
        client_rects:
          allOf: [{ $ref: "#/components/schemas/NoiseBlock" }]
          properties:
            max_offset: { type: number }
        sensors: { $ref: "#/components/schemas/NoiseBlock" }
        fonts:
          allOf: [{ $ref: "#/components/schemas/NoiseBlock" }]
          description: |
            `enabled:true` hides a small deterministic per-profile subset of
            non-essential fonts (real host fonts otherwise pass through).

    NoiseBlock:
      type: object
      properties:
        enabled: { type: boolean }
        seed:
          type: integer
          description: Per-profile entropy; 0 = derive automatically.

    LaunchOptions:
      type: object
      description: |
        Per-profile launch customizations. The Launcher validates these at
        launch time with a conservative switch allowlist and refuses isolation,
        proxy, fingerprint-profile, CDP, and extension-loader override switches.
      properties:
        args:
          type: array
          items: { type: string }
          description: Safe Chromium switches, one full `--switch[=value]` per entry.
          example: ["--mute-audio", "--window-size=1200,900"]
        extension_dirs:
          type: array
          items: { type: string }
          description: Absolute unpacked extension directories.

    CreateProfileRequest:
      type: object
      required: [fingerprint]
      properties:
        name: { type: string }
        notes: { type: string }
        proxy_id:
          type: string
          description: Bind a proxy already in the store (by id).
        proxy:
          type: string
          description: |
            Attach a proxy by string (`host:port:user:pass` or
            `scheme://user:pass@host:port`). On a **persistent** profile it is
            added to the proxy store (deduped by endpoint) and full-tested
            (UDP + geo), then bound by id — so it appears in the proxy list
            and QUIC/WebRTC gating has a cached result. On a **temporary**
            profile it is attached inline (not stored). Ignored if `proxy_id`
            is set.
          example: "socks5://user:pass@1.2.3.4:1080"
        folder:
          type: string
          description: Folder tag (ignored on /folders/{folder}/profiles, which wins).
        color:
          type: string
          description: |
            Accent for the profile's window icon and for the pill carrying its
            name in the omnibox. Omit it and the icon derives a colour from the
            name while the pill keeps the browser's own toolbar colour.
          example: "#2FCB80"
        extensions:
          type: array
          items: { type: string }
          description: |
            Extension-library ids (`GET /extensions`), loaded at launch. An id
            the library does not hold is a 400 rather than a profile that
            silently starts without it.
        tags:
          type: array
          items: { type: string }
          description: |
            Tag names. Each is trimmed, inner whitespace collapsed and capped at
            32 characters; a name matching an existing tag case-insensitively
            takes that tag's spelling. Duplicates and empty names are dropped.
            At most 64.
          example: ["Client A", "warm-up"]
        fingerprint:
          allOf: [{ $ref: "#/components/schemas/Fingerprint" }]
          description: Stored verbatim. Get one from /fingerprint/new and edit as needed.
        launch:
          $ref: "#/components/schemas/LaunchOptions"

    EditProfileRequest:
      type: object
      description: All fields optional — only what's present is changed.
      properties:
        name: { type: string }
        notes: { type: string }
        folder: { type: string, description: '"" unfiles (moves to All).' }
        proxy_id: { type: string, description: '"" unbinds the proxy.' }
        proxy:
          type: string
          description: Proxy string — stored (deduped) + full-tested, then bound.
        color:
          type: string
          description: '`#rrggbb`; "" goes back to the name-derived colour.'
        extensions:
          type: array
          items: { type: string }
          description: Replaces the whole list; `[]` loads none.
        tags:
          type: array
          items: { type: string }
          description: |
            Replaces the whole list; `[]` clears it. Normalized as on create.
            More than 64 tags is a 400 and nothing is saved. Refused with 409
            while the profile runs, like every other edit.
        fingerprint:
          allOf: [{ $ref: "#/components/schemas/Fingerprint" }]
          description: When present, REPLACES the stored fingerprint verbatim.

    TempProfileRequest:
      type: object
      properties:
        fingerprint_id:
          type: string
          description: Library entry to base off; random match for `platform` when omitted.
        platform:
          type: string
          enum: [Windows, macOS, Linux]
          description: Used to pick a random fingerprint when `fingerprint_id` is omitted; host OS when both omitted.
        proxy:
          type: string
          description: Inline proxy string (not saved to the store).
        noise:
          allOf: [{ $ref: "#/components/schemas/NoisePrefs" }]
          description: |
            Per-vector noise override for the temporary profile; seed 0 is
            derived from the temporary profile id.
        launch:
          $ref: "#/components/schemas/LaunchOptions"
        name: { type: string }
        folder: { type: string }
        noise:
          type: object
          description: |
            Per-vector fingerprint noise. Vectors left out keep their default
            (off). Two forms, mixable in one request:

              * shorthand — `{"canvas": true, "webgl": true}`; turning `webgl`
                or `client_rects` on this way also gives it the strength the UI
                uses, since a vector enabled at zero strength does nothing
              * full block — `{"canvas": {"enabled": true, "seed": 42}}`, the
                same shape `GET /profiles/{id}` hands back

            Fields are merged into the vector rather than replacing it, so
            `{"webgl": {"intensity": 0.001}}` leaves `enabled` alone. A `seed`
            of `0` (or omitted) still means "derive a stable one from the
            profile id", which is what keeps two temporary profiles from
            sharing a fingerprint.
          additionalProperties:
            oneOf:
              - type: boolean
              - type: object
                properties:
                  enabled: { type: boolean }
                  seed: { type: integer, format: int64 }
                  intensity: { type: number, description: "`webgl` only." }
                  max_offset: { type: number, description: "`client_rects` only." }
          properties:
            canvas: {}
            webgl: {}
            audio: {}
            client_rects: {}
            sensors: {}
            fonts: {}
          example:
            canvas: true
            webgl: { enabled: true, intensity: 0.0005 }
            fonts: true

    Extension:
      type: object
      properties:
        id: { type: string, description: Pass this in a profile's `extensions`. }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        size_bytes: { type: integer, format: int64 }
        added_at: { type: string, description: "`@<unix_secs>`." }
        icon:
          type: string
          nullable: true
          description: |
            Largest icon the manifest declares, as a `data:` URL. Null on the
            listing endpoint and on extensions that ship none.

    AddExtensionRequest:
      type: object
      description: Exactly one of `url` or `path`.
      properties:
        url:
          type: string
          description: |
            A Chrome Web Store page, a bare 32-character extension id, or a
            direct link to a `.crx` / `.zip`.
          example: https://chromewebstore.google.com/detail/rabby-wallet/acmacodkjbdgmoleebolmdjonilkdbch
        path:
          type: string
          description: A local `.crx`, `.zip` or unpacked folder on the launcher's machine.

    Bookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        url: { type: string }
        folder:
          type: string
          description: Launcher folder; empty means every profile.

    BookmarkRequest:
      type: object
      required: [url]
      properties:
        id:
          type: string
          description: Present updates that bookmark; absent creates one.
        url:
          type: string
          description: A bare host is fine — `https://` is added.
          example: facebook.com/ads/manager
        title:
          type: string
          description: Blank uses the address itself.
        folder:
          type: string
          description: Empty (or absent) means every profile.

    TrashEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        folder: { type: string }
        deleted_at: { type: integer, format: int64, description: Unix seconds. }
        expires_at:
          type: integer
          format: int64
          description: Unix seconds; the startup sweep removes anything past it.
        size_bytes:
          type: integer
          format: int64
          description: The archive, which holds the account and not the caches.

    ProfileMeta:
      type: object
      description: Launcher-facing profile metadata (returned by create).
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: string }
        proxy_id: { type: string, nullable: true }
        last_launched_at: { type: string, nullable: true, description: ISO-8601 or null. }
        created_at: { type: string, nullable: true }
        pinned: { type: boolean }
        folder: { type: string }
        color:
          type: string
          nullable: true
          description: |
            Icon accent as `#rrggbb`; `null` means it is derived from the name,
            which is what the browser does when nothing is chosen.
        extensions:
          type: array
          items: { type: string }
          description: Extension-library ids loaded at launch.
        tags:
          type: array
          items: { type: string }
          description: Tag names as stored (see `GET /tags` for colors and counts).

    TagInfo:
      type: object
      properties:
        name: { type: string }
        color:
          type: string
          nullable: true
          description: Palette id such as `teal`; `null` means the launcher derives one from the name.
        count:
          type: integer
          description: Profiles carrying the tag; 0 for a tag that so far only has a color.

    ProfileListItem:
      allOf:
        - $ref: "#/components/schemas/ProfileMeta"
        - type: object
          properties:
            running: { type: boolean }
            pid: { type: integer, format: int64, nullable: true }
            cdp:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/CdpInfo" }]

    StoredProfile:
      type: object
      description: |
        Full on-disk profile: the `_meta` envelope plus the flattened
        FingerprintConfig (all `Fingerprint` fields appear at the top
        level). `running`/`cdp` are present only while the profile runs.
      additionalProperties: true
      properties:
        _meta:
          type: object
          properties:
            id: { type: string, format: uuid }
            proxy_id: { type: string, nullable: true }
            inline_proxy:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/ProxyEntry" }]
            last_launched_at: { type: string, nullable: true }
            created_at: { type: string, nullable: true }
            pinned: { type: boolean }
            folder: { type: string }
            tags:
              type: array
              items: { type: string }
              description: Absent when the profile has no tags.
            temporary: { type: boolean }
        running: { type: boolean }
        cdp:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CdpInfo" }]

    CdpInfo:
      type: object
      description: Chrome DevTools Protocol endpoint of a running profile.
      properties:
        port: { type: integer, description: Chrome-chosen remote-debugging port. }
        http_url:
          type: string
          example: "http://127.0.0.1:53217"
          description: REST base (/json, /json/version).
        web_socket_debugger_url:
          type: string
          example: "ws://127.0.0.1:53217/devtools/browser/ab12-..."
          description: Browser-level WS endpoint for Puppeteer/Playwright `connect`.

    RunningProfile:
      type: object
      properties:
        profile_id: { type: string }
        pid: { type: integer, format: int64 }
        cdp:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/CdpInfo" }]

    LibraryEntry:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        platform: { type: string, enum: [Windows, macOS, Linux] }
        chrome: { type: string, description: Chrome version string. }
        gpu: { type: string }
        builtin: { type: boolean, description: Part of the bundled starter set. }

    AddProxyRequest:
      type: object
      description: A proxy string OR explicit fields (string wins).
      properties:
        proxy:
          type: string
          description: "`scheme://user:pass@host:port` or `host:port:user:pass`."
        kind: { type: string, enum: [socks5, http, https] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        name: { type: string }
        country: { type: string }
        notes: { type: string }

    ProxySummary:
      type: object
      description: Stored proxy without credentials.
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [socks5, http, https] }
        host: { type: string }
        port: { type: integer }
        country: { type: string, description: Informational tag (e.g. "US"). }

    Cookie:
      type: object
      description: |
        A cookie in a tool-friendly shape (compatible with EditThisCookie /
        Puppeteer exports — `httpOnly`/`sameSite` are accepted as aliases on
        import).
      required: [domain, name, value]
      properties:
        domain:
          type: string
          description: Cookie host (Chromium `host_key`), e.g. ".example.com".
        name: { type: string }
        value: { type: string }
        path: { type: string, default: "/" }
        expires:
          type: number
          nullable: true
          description: Unix seconds; null/absent = session cookie.
        secure: { type: boolean, default: false }
        http_only: { type: boolean, default: false }
        same_site:
          type: string
          enum: [Strict, Lax, None, unspecified]
          description: Case-insensitive on import.

    ProxyEntry:
      type: object
      description: Full proxy (as embedded in `_meta.inline_proxy`).
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [socks5, http, https] }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        country: { type: string }
        notes: { type: string }
