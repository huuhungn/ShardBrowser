# Build native Tauri bundles, sign updater artifacts with the Tauri updater
# key, and publish the custom fork release with its matching MCP source.
#
# Windows bundles are intentionally not Authenticode-signed. Manual installs
# can therefore show Windows SmartScreen / Unknown Publisher. A tag push
# publishes publicly; a manual run publishes only when enabled explicitly.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version for the build (for example v0.1.29).'
        required: true
      publish_release:
        description: 'Publish a public GitHub Release after all updater-signed builds pass.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    name: validate release request
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust SDK MSRV
        uses: dtolnay/rust-toolchain@1.74.1

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify JavaScript dependency and SDK gates
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm audit --audit-level=moderate
          npm ci --prefix mcp
          npm audit --prefix mcp --audit-level=moderate
          npm test --prefix mcp
          npm ci --prefix sdks/node
          npm audit --prefix sdks/node --audit-level=moderate
          npm test --prefix sdks/node
          npm ci --prefix ui-kit
          npm audit --prefix ui-kit --audit-level=moderate

      - name: Verify Rust SDK stable gates
        run: |
          cargo +stable test --manifest-path sdks/rust/Cargo.toml --all-features
          cargo +stable test --manifest-path sdks/rust/Cargo.toml --no-default-features

      - name: Verify Rust RustSec gates
        run: |
          cargo +stable install cargo-audit --locked --version 0.22.2
          cargo +stable audit --file sdks/rust/Cargo.lock
          # The launcher ships to users too, so its lockfile is audited as
          # well. RUSTSEC-2026-0194/0195 are ignored for one reason only:
          # the vulnerable quick-xml is pulled by wayland-scanner, a
          # proc-macro that generates bindings at compile time, so the
          # parser never runs in a shipped binary. Drop these once a
          # wayland-scanner release relaxes the pin.
          cargo +stable audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195
          # shared builds into the launcher as shardx-core, and server is
          # published as a release asset, so both ship and both are audited.
          cargo +stable audit --file shared/Cargo.lock
          # RUSTSEC-2023-0071 has no fixed release. rsa reaches the lockfile
          # only through sqlx's unused mysql feature: server enables just
          # sqlite, and a release build produces no rsa artifact. Drop this
          # ignore if the server ever enables a MySQL backend.
          cargo +stable audit --file server/Cargo.lock \
            --ignore RUSTSEC-2023-0071

      - name: Verify Rust SDK MSRV gates
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          rm -f sdks/rust/Cargo.lock
          cargo +stable generate-lockfile --manifest-path sdks/rust/Cargo.toml
          cargo +1.74.1 test --locked --manifest-path sdks/rust/Cargo.toml --all-features
          cargo +1.74.1 test --locked --manifest-path sdks/rust/Cargo.toml --no-default-features

      - name: Install Linux dependencies for updater key verification
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Verify updater signing key matches the shipped public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Tauri updater artifacts require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
          fixture="$RUNNER_TEMP/shardx-updater-key-check.bin"
          printf 'ShardX updater signing key check\n' > "$fixture"
          npx tauri signer sign "$fixture" >/dev/null
          test -s "$fixture.sig"
          SHARDX_UPDATER_TEST_ARTIFACT="$fixture" \
          SHARDX_UPDATER_TEST_SIGNATURE="$fixture.sig" \
            cargo +stable test --quiet --manifest-path src-tauri/Cargo.toml \
              --lib updater_private_key_matches_shipped_public_key -- --ignored
          rm -f "$fixture" "$fixture.sig"

      - name: Validate requested version
        id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          version="$(node -p "require('./package.json').version")"
          expected="v$version"
          if [ "$tag" != "$expected" ]; then
            echo "Release tag $tag must match package version $expected." >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const versions = {
            root: require('./package.json').version,
            mcp: require('./mcp/package.json').version,
            tauri: require('./src-tauri/tauri.conf.json').version,
            cargo: fs.readFileSync('./src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)/m)?.[1],
          };
          if (new Set(Object.values(versions)).size !== 1) {
            console.error(versions);
            process.exit(1);
          }
          NODE

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The publish job reads its notes from CHANGELOG.md and refuses a tag
      # with no matching section. Checking it here costs seconds; leaving it
      # to publish wastes three platform builds first.
      - name: Verify the changelog documents this release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          notes=$(awk -v want="## $TAG" '
            $0 == want { hit = 1; next }
            hit && /^## / { exit }
            hit { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $TAG." >&2
            exit 1
          fi

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: mac-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: win-x64

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          # 22, not 20: @tailwindcss/oxide (pulled in by the vendored ui-kit)
          # declares engines node >= 20, so 20 sits exactly on the boundary.
          # Below it npm SILENTLY skips the platform-specific native binary and
          # the ui-kit build dies with "Cannot find module
          # tailwindcss-oxide.<platform>.node" — an error that reads like a
          # broken dependency rather than a wrong Node.
          node-version: 22
          cache: npm
          # The ui-kit is a file: dependency built by the root `prebuild` hook,
          # and its install pulls ~300 more packages. Without its lockfile in
          # the cache key, changing it would not invalidate the npm cache.
          cache-dependency-path: |
            package-lock.json
            ui-kit/package-lock.json

      - name: Set up Rust (stable, ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-

      - name: Remove cached bundle outputs
        run: >-
          node -e "require('node:fs').rmSync('src-tauri/target/${{ matrix.target }}/release/bundle', { recursive: true, force: true })"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # The SDK's platform-gated branches (host probes, archive layout, cache
      # paths) only compile on their own OS, so run its tests on every runner
      # in the matrix rather than on Linux alone.
      - name: Verify Rust SDK on this platform
        run: cargo test --manifest-path sdks/rust/Cargo.toml --all-features

      - name: Validate Tauri updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Tauri updater artifacts require TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi

      - name: Build updater-signed Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Verify NSIS upgrade replaces the installed executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-nsis-upgrade.ps1

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/${{ matrix.target }}/release/bundle \
            -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
               -o -name '*.sig' \) \
            -exec cp -v {} staging/ \;
          ls -la staging/

      - name: Collect Windows portable binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rel="src-tauri/target/${{ matrix.target }}/release"
          if [ -f "$rel/ShardX Launcher.exe" ]; then
            src="$rel/ShardX Launcher.exe"
          else
            src="$rel/shardx-launcher.exe"
          fi
          cp -v "$src" "staging/ShardX-Launcher-portable-${{ matrix.label }}.exe"

      - name: Build the team server
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path server/Cargo.toml

      - name: Collect the team server binary
        shell: bash
        run: |
          # The grant and generation endpoints live in the server, not the
          # Launcher. Without shipping it, those features are source-only and a
          # release cannot actually deliver them.
          rel="server/target/${{ matrix.target }}/release"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          src="$rel/shardx-team-server$ext"
          if [ ! -f "$src" ]; then
            echo "team server binary not found at $src" >&2
            ls -la "$rel" >&2 || true
            exit 1
          fi
          cp -v "$src" "staging/shardx-team-server-${{ matrix.label }}$ext"

      - name: Verify the team server binary was collected
        shell: bash
        run: |
          # The publish job checks the merged set, but that job is skipped on a
          # dry run, so a packaging break would only surface during a real
          # release. Check here too, where every dry run reaches it.
          set -euo pipefail
          found=$(find staging -name 'shardx-team-server-*' | head -n 1)
          if [ -z "$found" ]; then
            echo "No server binary in staging for ${{ matrix.label }}." >&2
            ls -la staging >&2
            exit 1
          fi
          echo "Server binary staged: $found"
      - name: Upload updater-signed build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shardx-launcher-${{ needs.validate.outputs.tag }}-${{ matrix.label }}
          path: staging/*
          if-no-files-found: error

  release:
    needs:
      - validate
      - build
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-latest
    name: publish release

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Test ShardX MCP
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --prefix mcp
          npm test --prefix mcp

      - name: Download every per-platform artifact
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Normalize GitHub release asset names
        shell: bash
        run: |
          while IFS= read -r -d '' source; do
            name="$(basename "$source")"
            normalized="${name// /.}"
            target="dist/$normalized"
            if [ -e "$target" ]; then
              echo "Release asset normalization collision: $name -> $normalized" >&2
              exit 1
            fi
            mv -v "$source" "$target"
          done < <(find dist -maxdepth 1 -type f -name '* *' -print0)

          if find dist -maxdepth 1 -type f -name '* *' -print -quit | grep -q .; then
            echo "GitHub release asset names must not contain spaces." >&2
            exit 1
          fi

      - name: Validate and package ShardX MCP
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          test -f mcp/package-lock.json
          node --check mcp/index.js
          for helper in health_check startup_status configure_startup find_profile_by_name ensure_profile_started safe_open_url devtools_context cleanup_stale_profile_processes challenge_status verification_checkpoint wait_for_human_verification; do
            grep -q "\"$helper\"" mcp/index.js
          done
          npm run test:release-package
          npm run test:updater-signatures
          package_root="$RUNNER_TEMP/ShardX-MCP"
          node scripts/stage-mcp-release.mjs "$package_root"
          node scripts/stage-mcp-release.mjs --verify-directory "$package_root"
          tar -czf dist/ShardX-MCP.tar.gz -C "$RUNNER_TEMP" ShardX-MCP
          archive_entries="$RUNNER_TEMP/ShardX-MCP-entries.txt"
          tar -tzf dist/ShardX-MCP.tar.gz | tee "$archive_entries"
          node scripts/stage-mcp-release.mjs --verify-archive-entries ShardX-MCP < "$archive_entries"
          verify_root="$RUNNER_TEMP/ShardX-MCP-verify"
          mkdir -p "$verify_root"
          tar -xzf dist/ShardX-MCP.tar.gz -C "$verify_root"
          node scripts/stage-mcp-release.mjs --verify-directory "$verify_root/ShardX-MCP"
          npm ci --prefix "$verify_root/ShardX-MCP"
          npm test --prefix "$verify_root/ShardX-MCP"

      - name: Generate static updater manifest
        run: node scripts/generate-updater-manifest.mjs --dist dist --tag "${{ needs.validate.outputs.tag }}" --repo "${{ github.repository }}"

      - name: Verify updater signatures against the shipped public key
        run: node scripts/verify-updater-signatures.mjs --dist dist

      - name: Verify the server binaries are present
        shell: bash
        run: |
          # The grant and generation endpoints are server-side. A release that
          # quietly lost these would ship a Launcher that cannot reach them,
          # which is exactly what v0.2.3 did.
          missing=0
          for label in mac-arm64 linux-x64 win-x64; do
            ext=""
            if [ "$label" = win-x64 ]; then ext=".exe"; fi
            if [ ! -f "dist/shardx-team-server-$label$ext" ]; then
              echo "missing server binary for $label" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            ls -la dist/ >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: List collected release assets
        run: ls -la dist/

      - name: Extract release highlights from the changelog
        run: |
          version="${{ needs.validate.outputs.tag }}"
          notes=$(awk -v want="## $version" '
            $0 == want { hit = 1; next }
            hit && /^## / { exit }
            hit { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi
          printf '%s\n\n' "$notes" | tr -d '\r' > release-highlights.md

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Custom integration release for [huuhungn/ShardBrowser](https://github.com/huuhungn/ShardBrowser).

          ## Highlights

          @@HIGHLIGHTS@@
          ## Install

          * **Windows** — the installer and portable executable are not Authenticode-signed, so Windows can show SmartScreen / **Unknown Publisher** during a manual install. The in-app updater separately verifies downloaded update bytes with the shipped Tauri updater public key.
          * **macOS** — Apple Silicon .dmg; this build is not notarized because the fork does not currently have an Apple Developer ID.
          * **Linux** — .AppImage or .deb.
          * **MCP** — ShardX-MCP.tar.gz contains the matching MCP source and host helpers. Launcher Settings downloads this asset from this exact fork release.
          * **Team server** — shardx-team-server-<platform> is the self-hosted server. It serves the v2 fleet, enrollment, root key generation, and grant endpoints that the Launcher's Team features talk to.

          Verify downloaded assets with SHA256SUMS.txt, latest.json signatures, or the GitHub build-provenance attestation.
          EOF
          sed -i -e '/@@HIGHLIGHTS@@/r release-highlights.md' -e '/@@HIGHLIGHTS@@/d' release-notes.md
          cat release-notes.md

      # Uploading the assets is the one step that fails for reasons that have
      # nothing to do with this repository. v2.2.7 published every one of its 20
      # assets and still ended red: a single asset stalled for 148s of a 197s
      # step and the run reported "Error saving asset" after the release was
      # already complete. The same payload took 3.4s on v2.2.8. The action has no
      # retry or per-asset timeout input, so the retry has to live here.
      #
      # Re-running the action is safe: `overwrite_files` defaults to true, so the
      # second attempt replaces whatever the first one managed to upload rather
      # than duplicating or rejecting it. `continue-on-error` on the first
      # attempt keeps a slow upload from failing the release; if the retry also
      # fails the job still goes red, which is what we want.
      - name: Create or update GitHub Release
        id: publish
        continue-on-error: true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ShardX Launcher ${{ needs.validate.outputs.tag }} custom integration
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release-notes.md
          files: dist/*

      - name: Retry release upload
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ShardX Launcher ${{ needs.validate.outputs.tag }} custom integration
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release-notes.md
          files: dist/*
