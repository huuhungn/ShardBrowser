name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  rust-sdk:
    runs-on: ubuntu-22.04
    name: Rust SDK stable and MSRV

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Rust SDK MSRV
        uses: dtolnay/rust-toolchain@1.74.1

      - name: Rust SDK stable checks
        run: |
          cargo +stable test --manifest-path sdks/rust/Cargo.toml --all-features
          cargo +stable test --manifest-path sdks/rust/Cargo.toml --no-default-features
          cargo +stable clippy --manifest-path sdks/rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo +stable clippy --manifest-path sdks/rust/Cargo.toml --all-targets --no-default-features -- -D warnings

      - name: Rust SDK RustSec audit
        run: |
          cargo +stable install cargo-audit --locked --version 0.22.2
          cargo +stable audit --file sdks/rust/Cargo.lock

      - name: Rust SDK MSRV checks
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          rm -f sdks/rust/Cargo.lock
          cargo +stable generate-lockfile --manifest-path sdks/rust/Cargo.toml
          cargo +1.74.1 test --locked --manifest-path sdks/rust/Cargo.toml --all-features
          cargo +1.74.1 test --locked --manifest-path sdks/rust/Cargo.toml --no-default-features

  # Every runner above is Linux, so the cfg(windows) half of the codebase --
  # os_crypt key handling, cookie decryption, process control, autostart --
  # had no CI coverage at all. Windows is the launcher's primary platform, so
  # the crates carrying those branches are tested there too.
  windows-rust:
    runs-on: windows-latest
    name: Rust tests on Windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/target
            server/target
            src-tauri/target
            sdks/rust/target
          key: windows-rust-${{ hashFiles('shared/Cargo.lock', 'server/Cargo.lock', 'src-tauri/Cargo.lock', 'sdks/rust/Cargo.lock') }}

      - name: Shared core tests
        run: cargo test --manifest-path shared/Cargo.toml

      - name: Team server tests
        run: cargo test --manifest-path server/Cargo.toml

      # Holds the only Windows-gated test in the tree
      # (windows_resume_uses_the_autostart_argument), which no Linux runner
      # can execute.
      - name: Launcher tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The SDK's Windows-gated branches (host paths, runtime process control)
      # were otherwise compiled only on Linux and macOS.
      - name: Rust SDK tests
        run: cargo test --manifest-path sdks/rust/Cargo.toml --all-features

  macos-check:
    runs-on: macos-14
    name: Rust compiles on macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/target
            sdks/rust/target
          key: macos-check-${{ hashFiles('shared/Cargo.lock', 'sdks/rust/Cargo.lock') }}

      # The macOS-only branches (os_crypt key derivation, cookie decryption,
      # runtime and host paths) compile nowhere else: a Linux runner cannot
      # cross-check them because both crates build C code (rusqlite, ring).
      # Without this job a macOS compile error only surfaces at release time.
      - name: Shared core compiles
        run: cargo check --manifest-path shared/Cargo.toml --all-targets

      - name: Rust SDK compiles
        run: cargo check --manifest-path sdks/rust/Cargo.toml --all-targets --all-features

  checks:
    runs-on: ubuntu-22.04
    name: frontend, Rust, and MCP checks

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # ui-kit is compiled into every bundle by the root prebuild step, so a
      # lint failure there ships with the app.
      - name: Lint the interface toolkit
        run: |
          npm ci --prefix ui-kit
          npm run lint --prefix ui-kit

      - name: Frontend build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Launcher UI regression tests
        id: e2e
        run: npm run test:e2e

      - name: Upload UI failure diagnostics
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: launcher-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Install MCP dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix mcp

      - name: MCP tests
        run: npm test --prefix mcp

      - name: MCP release manifest tests
        run: npm run test:release-package

      - name: Profile form round-trip tests
        run: npm run test:profile-form

      - name: Updater signature verification tests
        run: npm run test:updater-signatures

      - name: Interface language tests
        run: |
          npm run test:i18n
          npm run test:rust-strings
          npm run test:backend-locale

      # The three tests above read files. This one renders a real toast from a
      # real backend error code in a real build, which is the only way to catch
      # a code that reaches the operator untranslated. It rebuilds production
      # itself, because test:e2e above leaves dist/ built with the E2E mock.
      - name: Backend error toasts render in Vietnamese
        id: vi_toasts
        run: npm run vi:toasts

      - name: Upload toast screenshots on failure
        if: failure() && steps.vi_toasts.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: vi-toasts-${{ github.run_id }}-${{ github.run_attempt }}
          path: vi-toast-shots/
          if-no-files-found: ignore
          retention-days: 7

      # The release workflow gates on these, but only inside the release job.
      # Running them here keeps zip-extraction regressions from reaching a tag.
      - name: Node SDK tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --prefix sdks/node
          npm test --prefix sdks/node

      - name: MCP release package smoke
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PATCHRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          package_root="$RUNNER_TEMP/ShardX-MCP"
          archive="$RUNNER_TEMP/ShardX-MCP.tar.gz"
          verify_root="$RUNNER_TEMP/ShardX-MCP-verify"
          node scripts/stage-mcp-release.mjs "$package_root"
          node scripts/stage-mcp-release.mjs --verify-directory "$package_root"
          tar -czf "$archive" -C "$RUNNER_TEMP" ShardX-MCP
          tar -tzf "$archive" | node scripts/stage-mcp-release.mjs --verify-archive-entries ShardX-MCP
          mkdir -p "$verify_root"
          tar -xzf "$archive" -C "$verify_root"
          node scripts/stage-mcp-release.mjs --verify-directory "$verify_root/ShardX-MCP"
          npm ci --prefix "$verify_root/ShardX-MCP"
          npm test --prefix "$verify_root/ShardX-MCP"

      - name: MCP syntax and helper contract
        run: |
          node --check mcp/index.js
          for helper in health_check startup_status configure_startup find_profile_by_name ensure_profile_started safe_open_url devtools_context cleanup_stale_profile_processes; do
            grep -q "\"$helper\"" mcp/index.js
          done

      - name: Version parity
        run: node -e "const fs=require('fs'); const v={root:require('./package.json').version,mcp:require('./mcp/package.json').version,tauri:require('./src-tauri/tauri.conf.json').version,cargo:fs.readFileSync('./src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*\"([^\"]+)/m)?.[1]}; if(new Set(Object.values(v)).size!==1){console.error(v); process.exit(1)}"

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Shared core tests
        run: cargo test --manifest-path shared/Cargo.toml

      - name: Team server tests
        run: cargo test --manifest-path server/Cargo.toml

      # The launcher's enrollment test drives a real team-server process, so
      # the binary has to exist before the test run.
      - name: Build team server for integration tests
        run: cargo build --manifest-path server/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
